<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Line chart - /design-system-guidantstudios components</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='8' fill='%231433d6'/%3E%3Cpath d='M17 11h6v6h-6zM23 11h6v6h-6zM29 11h6v6h-6zM35 11h6v6h-6zM41 11h6v6h-6zM11 17h6v6h-6zM11 23h6v6h-6zM11 29h6v6h-6zM29 29h6v6h-6zM35 29h6v6h-6zM41 29h6v6h-6zM47 29h6v6h-6zM11 35h6v6h-6zM47 35h6v6h-6zM11 41h6v6h-6zM47 41h6v6h-6zM17 47h6v6h-6zM23 47h6v6h-6zM29 47h6v6h-6zM35 47h6v6h-6zM41 47h6v6h-6z' fill='%23fff'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,400..800&family=JetBrains+Mono:wght@400;500;700&family=Doto:wght@700;900&display=swap" rel="stylesheet">
<style>
html { color-scheme: dark; }
html[data-theme="light"] { color-scheme: light; }
:root, html[data-theme="dark"] {
  --bg:#0b0b0f; --card:#0b0b0f; --text:#f2f3f5; --muted:#9a9ea8; --accent:#6f86ff;
  --line:rgba(242,243,245,.22); --shadow:rgba(242,243,245,.35);
}
html[data-theme="light"] {
  --bg:#f6f6f3; --card:#ffffff; --text:#0b0b0f; --muted:#5d6069; --accent:#1433d6;
  --line:rgba(11,11,15,.18); --shadow:rgba(11,11,15,.9);
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
  background:var(--bg); color:var(--text);
  font-family:'Archivo',sans-serif; font-weight:400;
  transition:background .25s, color .25s;
  min-height:100vh; display:flex; align-items:center; justify-content:center;
  padding:72px 28px;
}
.doto { font-family:'Doto',sans-serif; font-weight:900; margin:0 .18em; }
.kicker {
  font-size:11px; font-weight:400; letter-spacing:6px; text-transform:uppercase;
  color:var(--muted);
}
.stage { width:100%; max-width:860px; }
#themeToggle {
  position:fixed; top:16px; right:16px; z-index:100;
  width:40px; height:40px; border:2px solid var(--text); background:var(--card);
  color:var(--text); border-radius:0; cursor:pointer; font-size:18px; line-height:1;
  font-family:'Archivo',sans-serif; box-shadow:3px 3px 0 var(--shadow);
}
#themeToggle:active { box-shadow:1px 1px 0 var(--shadow); transform:translate(2px,2px); }

.chart { border:2px solid var(--text); background:var(--card); padding:26px 28px 20px; box-shadow:6px 6px 0 var(--shadow); max-width:560px; }
.chart-t { font-size:19px; font-weight:600; letter-spacing:-0.4px; margin:6px 0 18px; }
.lchart { width:100%; display:block; }
.lchart .grid { stroke:var(--line); stroke-width:1; }
.lchart .s1 { stroke:var(--accent); stroke-width:2.5; fill:none; }
.lchart .s2 { stroke:var(--muted); stroke-width:2; fill:none; stroke-dasharray:1 6; stroke-linecap:round; }
.lchart .pt { fill:var(--accent); }
.lchart .lbl { font:400 10px 'Archivo',sans-serif; letter-spacing:2px; fill:var(--muted); text-transform:uppercase; }
.leg { display:flex; gap:22px; margin-top:12px; font-size:12px; color:var(--muted); }
.leg span { display:inline-flex; align-items:center; gap:8px; }
.leg i { width:16px; height:3px; background:var(--accent); }
.leg .q i { background:var(--muted); height:2px; }
</style>
</head>
<body>
<button id="themeToggle" aria-label="Toggle dark / light mode">◐</button>
<div class="stage">
<figure class="chart">
  <div class="kicker">Members · monthly</div>
  <div class="chart-t">Retention holds while the free list grows</div>
  <svg class="lchart" viewBox="0 0 500 190">
    <line class="grid" x1="0" y1="150" x2="500" y2="150"/>
    <line class="grid" x1="0" y1="95" x2="500" y2="95"/>
    <line class="grid" x1="0" y1="40" x2="500" y2="40"/>
    <polyline class="s2" points="10,120 108,112 206,118 304,104 402,96 490,92"/>
    <polyline class="s1" points="10,132 108,116 206,96 304,84 402,52 490,34"/>
    <circle class="pt" cx="490" cy="34" r="4.5"/>
    <text class="lbl" x="10" y="172">Feb</text><text class="lbl" x="206" y="172">Apr</text><text class="lbl" x="402" y="172">Jun</text>
  </svg>
  <div class="leg"><span><i></i>Paid members</span><span class="q"><i></i>Free newsletter</span></div>
</figure>
</div>
<script>

(function () {
  const root = document.documentElement;
  const apply = t => {
    root.setAttribute('data-theme', t);
    root.style.colorScheme = t;
    if (window.gsRedraw) window.gsRedraw();
  };
  const forced = new URLSearchParams(location.search).get('theme');
  apply(forced || localStorage.getItem('gs-theme') || 'light');
  document.getElementById('themeToggle').addEventListener('click', () => {
    const next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    localStorage.setItem('gs-theme', next);
    apply(next);
  });
  window.addEventListener('message', e => {
    if (e.data && e.data.gsTheme) { localStorage.setItem('gs-theme', e.data.gsTheme); apply(e.data.gsTheme); }
  });
})();

</script>
</body>
</html>
