<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flip-dot ticker - /design-system-guidantstudios components</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='8' fill='%231433d6'/%3E%3Cpath d='M17 11h6v6h-6zM23 11h6v6h-6zM29 11h6v6h-6zM35 11h6v6h-6zM41 11h6v6h-6zM11 17h6v6h-6zM11 23h6v6h-6zM11 29h6v6h-6zM29 29h6v6h-6zM35 29h6v6h-6zM41 29h6v6h-6zM47 29h6v6h-6zM11 35h6v6h-6zM47 35h6v6h-6zM11 41h6v6h-6zM47 41h6v6h-6zM17 47h6v6h-6zM23 47h6v6h-6zM29 47h6v6h-6zM35 47h6v6h-6zM41 47h6v6h-6z' fill='%23fff'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,400..800&family=JetBrains+Mono:wght@400;500;700&family=Doto:wght@700;900&display=swap" rel="stylesheet">
<style>
html { color-scheme: dark; }
html[data-theme="light"] { color-scheme: light; }
:root, html[data-theme="dark"] {
  --bg:#0b0b0f; --card:#0b0b0f; --text:#f2f3f5; --muted:#9a9ea8; --accent:#6f86ff;
  --line:rgba(242,243,245,.22); --shadow:rgba(242,243,245,.35);
}
html[data-theme="light"] {
  --bg:#f6f6f3; --card:#ffffff; --text:#0b0b0f; --muted:#5d6069; --accent:#1433d6;
  --line:rgba(11,11,15,.18); --shadow:rgba(11,11,15,.9);
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
  background:var(--bg); color:var(--text);
  font-family:'Archivo',sans-serif; font-weight:400;
  transition:background .25s, color .25s;
  min-height:100vh; display:flex; align-items:center; justify-content:center;
  padding:72px 28px;
}
.doto { font-family:'Doto',sans-serif; font-weight:900; margin:0 .18em; }
.kicker {
  font-size:11px; font-weight:400; letter-spacing:6px; text-transform:uppercase;
  color:var(--muted);
}
.stage { width:100%; max-width:860px; }
#themeToggle {
  position:fixed; top:16px; right:16px; z-index:100;
  width:40px; height:40px; border:2px solid var(--text); background:var(--card);
  color:var(--text); border-radius:0; cursor:pointer; font-size:18px; line-height:1;
  font-family:'Archivo',sans-serif; box-shadow:3px 3px 0 var(--shadow);
}
#themeToggle:active { box-shadow:1px 1px 0 var(--shadow); transform:translate(2px,2px); }

.tick { border:2px solid var(--text); background:var(--card); box-shadow:6px 6px 0 var(--shadow); padding:26px 30px 22px; display:grid; gap:14px; justify-items:center; }
.tick canvas { display:block; }
.tick .kicker { font-size:10px; letter-spacing:5px; }
</style>
</head>
<body>
<button id="themeToggle" aria-label="Toggle dark / light mode">◐</button>
<div class="stage">
<div class="tick">
  <span class="kicker">This week we</span>
  <canvas id="flip"></canvas>
</div>
</div>
<script>

(function () {
  const root = document.documentElement;
  const apply = t => {
    root.setAttribute('data-theme', t);
    root.style.colorScheme = t;
    if (window.gsRedraw) window.gsRedraw();
  };
  const forced = new URLSearchParams(location.search).get('theme');
  apply(forced || localStorage.getItem('gs-theme') || 'light');
  document.getElementById('themeToggle').addEventListener('click', () => {
    const next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    localStorage.setItem('gs-theme', next);
    apply(next);
  });
  window.addEventListener('message', e => {
    if (e.data && e.data.gsTheme) { localStorage.setItem('gs-theme', e.data.gsTheme); apply(e.data.gsTheme); }
  });
})();

// 5x7 dot glyphs - a flip-dot airport board cycling the operating loop
const G = {
 A:['01110','10001','10001','11111','10001','10001','10001'],B:['11110','10001','11110','10001','10001','10001','11110'],
 C:['01111','10000','10000','10000','10000','10000','01111'],D:['11110','10001','10001','10001','10001','10001','11110'],
 E:['11111','10000','11110','10000','10000','10000','11111'],H:['10001','10001','11111','10001','10001','10001','10001'],
 I:['11111','00100','00100','00100','00100','00100','11111'],L:['10000','10000','10000','10000','10000','10000','11111'],
 P:['11110','10001','10001','11110','10000','10000','10000'],S:['01111','10000','10000','01110','00001','00001','11110'],
 T:['11111','00100','00100','00100','00100','00100','00100'],U:['10001','10001','10001','10001','10001','10001','01110'],
 ' ':['00000','00000','00000','00000','00000','00000','00000']
};
const WORDS = ['BUILD', 'TEACH', 'SELL ', 'SHIP '];
const CELL = 13, R = 4.4, COLS = 5 * 5 + 4 * 2, ROWS = 7;
const cv = document.getElementById('flip'), cx = cv.getContext('2d');
const dpr = window.devicePixelRatio || 1;
const W = COLS * CELL, H = ROWS * CELL;
cv.width = W * dpr; cv.height = H * dpr; cv.style.width = W + 'px'; cv.style.height = H + 'px'; cx.scale(dpr, dpr);
function grid(word) {
  const g = [];
  for (let r = 0; r < ROWS; r++) { let row = ''; [...word].forEach((ch, i) => { row += (G[ch] || G[' '])[r] + (i < 4 ? '00' : ''); }); g.push(row); }
  return g;
}
let cur = grid(WORDS[0]), tgt = cur, prog = [], wi = 0, t0 = performance.now(), phase = 0;
function stagger() { prog = []; for (let r = 0; r < ROWS; r++) { prog.push([]); for (let c = 0; c < COLS; c++) prog[r].push(200 + ((r * 31 + c * 17) % 40) * 14); } }
stagger();
function draw(now) {
  const el = now - t0;
  cx.clearRect(0, 0, W, H);
  const on = getComputedStyle(document.body).getPropertyValue('--accent').trim();
  const off = document.documentElement.getAttribute('data-theme') === 'light' ? 'rgba(11,11,15,.10)' : 'rgba(242,243,245,.10)';
  for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
    const a = cur[r][c] === '1', b = tgt[r][c] === '1';
    let k; // dot scale 0..1 of "on-ness"
    if (phase === 0) k = a ? 1 : 0;
    else { const p = Math.min(1, Math.max(0, (el - prog[r][c]) / 260)); k = a === b ? (a ? 1 : 0) : (b ? p : 1 - p); }
    cx.fillStyle = off; cx.beginPath(); cx.arc(c * CELL + CELL/2, r * CELL + CELL/2, R, 0, 7); cx.fill();
    if (k > 0.02) { cx.fillStyle = on; cx.beginPath(); cx.arc(c * CELL + CELL/2, r * CELL + CELL/2, R * k, 0, 7); cx.fill(); }
  }
  if (phase === 0 && el > 1600) { wi = (wi + 1) % WORDS.length; tgt = grid(WORDS[wi]); stagger(); phase = 1; t0 = now; }
  else if (phase === 1 && el > 1100) { cur = tgt; phase = 0; t0 = now; }
  requestAnimationFrame(draw);
}
requestAnimationFrame(draw);

</script>
</body>
</html>
