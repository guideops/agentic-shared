<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Form input - /design-system-guidantstudios components</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='8' fill='%231433d6'/%3E%3Cpath d='M17 11h6v6h-6zM23 11h6v6h-6zM29 11h6v6h-6zM35 11h6v6h-6zM41 11h6v6h-6zM11 17h6v6h-6zM11 23h6v6h-6zM11 29h6v6h-6zM29 29h6v6h-6zM35 29h6v6h-6zM41 29h6v6h-6zM47 29h6v6h-6zM11 35h6v6h-6zM47 35h6v6h-6zM11 41h6v6h-6zM47 41h6v6h-6zM17 47h6v6h-6zM23 47h6v6h-6zM29 47h6v6h-6zM35 47h6v6h-6zM41 47h6v6h-6z' fill='%23fff'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,400..800&family=JetBrains+Mono:wght@400;500;700&family=Doto:wght@700;900&display=swap" rel="stylesheet">
<style>
html { color-scheme: dark; }
html[data-theme="light"] { color-scheme: light; }
:root, html[data-theme="dark"] {
  --bg:#0b0b0f; --card:#15161b; --text:#f2f3f5; --muted:#9a9ea8; --accent:#6f86ff;
  --line:rgba(242,243,245,.22); --shadow:#000; --fieldline:#15161b;   /* Ink Well Soft: borderless in dark */
}
html[data-theme="light"] {
  --bg:#f6f6f3; --card:#ffffff; --text:#0b0b0f; --muted:#5d6069; --accent:#1433d6;
  --line:rgba(11,11,15,.18); --shadow:rgba(11,11,15,.9); --fieldline:#0b0b0f;
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
  background:var(--bg); color:var(--text);
  font-family:'Archivo',sans-serif; font-weight:400;
  transition:background .25s, color .25s;
  min-height:100vh; display:flex; align-items:center; justify-content:center;
  padding:72px 28px;
}
.doto { font-family:'Doto',sans-serif; font-weight:900; margin:0 .18em; }
.kicker {
  font-size:11px; font-weight:400; letter-spacing:6px; text-transform:uppercase;
  color:var(--muted);
}
.stage { width:100%; max-width:860px; }
#themeToggle {
  position:fixed; top:16px; right:16px; z-index:100;
  width:40px; height:40px; border:2px solid var(--text); background:var(--card);
  color:var(--text); border-radius:0; cursor:pointer; font-size:18px; line-height:1;
  font-family:'Archivo',sans-serif; box-shadow:3px 3px 0 var(--shadow);
}
#themeToggle:active { box-shadow:1px 1px 0 var(--shadow); transform:translate(2px,2px); }

.form { display:grid; gap:24px; max-width:440px; }
.field { display:grid; gap:9px; }
.field label { font-size:10px; letter-spacing:4px; text-transform:uppercase; color:var(--muted); }
/* Ink Well Soft (locked 2026-07-08): r4, cobalt shadow FADES in on focus, same both modes */
.field input, .field textarea {
  font-family:'Archivo',sans-serif; font-size:15px; color:var(--text);
  background:var(--card); border:2px solid var(--fieldline); border-radius:4px;
  padding:13px 16px; outline:none;
  box-shadow:4px 4px 0 rgba(20,51,214,0); transition:box-shadow .3s ease, border-color .3s ease;
}
.field input:focus, .field textarea:focus { box-shadow:4px 4px 0 rgba(20,51,214,1); }
html[data-theme="light"] .field input:focus, html[data-theme="light"] .field textarea:focus { border-color:var(--accent); }
.field input::placeholder, .field textarea::placeholder { color:var(--muted); }
.field-hint { font-size:12px; color:var(--muted); }
.form-cta { justify-self:start; font-family:'Archivo',sans-serif; font-weight:600; font-size:15px; color:#fff; background:var(--accent); border:2px solid var(--accent); border-radius:4px; padding:13px 26px; cursor:pointer; box-shadow:0 0 0 rgba(0,0,0,0); transition:transform .15s ease, box-shadow .15s ease; }
.form-cta:hover { transform:translate(-2px,-2px); box-shadow:5px 5px 0 var(--shadow); }
.form-cta:active { transform:translate(1px,1px); box-shadow:0 0 0 rgba(0,0,0,0); transition-duration:.06s; }

/* GS lock: button voice = Archivo Expanded 600, uppercase, .08em, radius 4px */
.form-cta { font-family:'Archivo',sans-serif; font-stretch:125%; font-weight:600; text-transform:uppercase; letter-spacing:.08em; font-size:13px; border-radius:4px; }
</style>
</head>
<body>
<button id="themeToggle" aria-label="Toggle dark / light mode">◐</button>
<div class="stage">
<form class="form" onsubmit="return false">
  <div class="field">
    <label for="f-email">Email</label>
    <input id="f-email" type="email" placeholder="you@studio.com">
    <span class="field-hint">One build a week. No noise.</span>
  </div>
  <div class="field">
    <label for="f-goal">What are you automating first?</label>
    <textarea id="f-goal" rows="3" placeholder="Client reporting, every Monday, before I wake up."></textarea>
  </div>
  <button class="form-cta" type="submit">Send it</button>
</form>
</div>
<script>

(function () {
  const root = document.documentElement;
  const apply = t => {
    root.setAttribute('data-theme', t);
    root.style.colorScheme = t;
    if (window.gsRedraw) window.gsRedraw();
  };
  const forced = new URLSearchParams(location.search).get('theme');
  apply(forced || localStorage.getItem('gs-theme') || 'light');
  document.getElementById('themeToggle').addEventListener('click', () => {
    const next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    localStorage.setItem('gs-theme', next);
    apply(next);
  });
  window.addEventListener('message', e => {
    if (e.data && e.data.gsTheme) { localStorage.setItem('gs-theme', e.data.gsTheme); apply(e.data.gsTheme); }
  });
})();

</script>
</body>
</html>
