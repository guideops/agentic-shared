<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Card - /design-system-guidantstudios components</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='8' fill='%231433d6'/%3E%3Cpath d='M17 11h6v6h-6zM23 11h6v6h-6zM29 11h6v6h-6zM35 11h6v6h-6zM41 11h6v6h-6zM11 17h6v6h-6zM11 23h6v6h-6zM11 29h6v6h-6zM29 29h6v6h-6zM35 29h6v6h-6zM41 29h6v6h-6zM47 29h6v6h-6zM11 35h6v6h-6zM47 35h6v6h-6zM11 41h6v6h-6zM47 41h6v6h-6zM17 47h6v6h-6zM23 47h6v6h-6zM29 47h6v6h-6zM35 47h6v6h-6zM41 47h6v6h-6z' fill='%23fff'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,400..800&family=JetBrains+Mono:wght@400;500;700&family=Doto:wght@700;900&display=swap" rel="stylesheet">
<style>
html { color-scheme: dark; }
html[data-theme="light"] { color-scheme: light; }
:root, html[data-theme="dark"] {
  --bg:#0b0b0f; --card:#15161b; --text:#f2f3f5; --muted:#9a9ea8; --accent:#4466ff;
  --line:rgba(242,243,245,.22); --shadow:#000; --cardline:#15161b;   /* Ink Well Soft: dark cards are borderless */
}
html[data-theme="light"] {
  --bg:#f6f6f3; --card:#ffffff; --text:#0b0b0f; --muted:#5d6069; --accent:#1433d6;
  --line:rgba(11,11,15,.18); --shadow:rgba(11,11,15,.9); --cardline:#0b0b0f;
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
  background:var(--bg); color:var(--text);
  font-family:'Archivo',sans-serif; font-weight:400;
  transition:background .25s, color .25s;
  min-height:100vh; display:flex; align-items:center; justify-content:center;
  padding:72px 28px;
}
.doto { font-family:'Doto',sans-serif; font-weight:900; margin:0 .18em; }
.kicker {
  font-size:11px; font-weight:400; letter-spacing:6px; text-transform:uppercase;
  color:var(--muted);
}
.stage { width:100%; max-width:860px; }
#themeToggle {
  position:fixed; top:16px; right:16px; z-index:100;
  width:40px; height:40px; border:2px solid var(--text); background:var(--card);
  color:var(--text); border-radius:0; cursor:pointer; font-size:18px; line-height:1;
  font-family:'Archivo',sans-serif; box-shadow:3px 3px 0 var(--shadow);
}
#themeToggle:active { box-shadow:1px 1px 0 var(--shadow); transform:translate(2px,2px); }

/* Ink Well Soft (locked 2026-07-08): r4, light = ink frame, dark = borderless raised surface */
.rcard {
  position:relative; border:2px solid var(--cardline); background:var(--card); border-radius:4px;
  padding:26px 26px 24px; max-width:340px;
  box-shadow:6px 6px 0 var(--shadow); transition:transform .18s ease, box-shadow .18s ease;
}
.rcard:hover { transform:translate(-2px,-4px); box-shadow:9px 9px 0 var(--shadow); }
.rcard.hot { --shadow:var(--accent); }
.rcard.hot .rcard-t { color:var(--accent); }
html[data-theme="light"] .rcard.hot { --cardline:var(--accent); }   /* dark hot stays borderless */
.rcard-ic { width:44px; height:44px; margin-bottom:18px; image-rendering:pixelated; }
.rcard-k { font-size:10px; letter-spacing:5px; text-transform:uppercase; color:var(--muted); margin-bottom:8px; }
.rcard-t { font-size:21px; font-weight:600; letter-spacing:-0.5px; margin-bottom:8px; transition:color .15s; }
.rcard-s { font-size:14px; color:var(--muted); line-height:1.55; }
</style>
</head>
<body>
<button id="themeToggle" aria-label="Toggle dark / light mode">◐</button>
<div class="stage">
<div class="rcard">
  <canvas class="rcard-ic" id="icDoc"></canvas>
  <div class="rcard-k">Module 03</div>
  <div class="rcard-t">Ship your first agent</div>
  <div class="rcard-s">Wire one skill, one memory file, and one schedule - then let it run a real task overnight.</div>
</div>
</div>
<script>

(function () {
  const root = document.documentElement;
  const apply = t => {
    root.setAttribute('data-theme', t);
    root.style.colorScheme = t;
    if (window.gsRedraw) window.gsRedraw();
  };
  const forced = new URLSearchParams(location.search).get('theme');
  apply(forced || localStorage.getItem('gs-theme') || 'light');
  document.getElementById('themeToggle').addEventListener('click', () => {
    const next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    localStorage.setItem('gs-theme', next);
    apply(next);
  });
  window.addEventListener('message', e => {
    if (e.data && e.data.gsTheme) { localStorage.setItem('gs-theme', e.data.gsTheme); apply(e.data.gsTheme); }
  });
})();

function sprite(canvasId, rows, palette, px) {
  const c = document.getElementById(canvasId); if (!c) return;
  const ctx = c.getContext('2d');
  c.width = rows[0].length * px; c.height = rows.length * px;
  ctx.clearRect(0,0,c.width,c.height);
  rows.forEach((row, y) => [...row].forEach((k, x) => {
    if (k !== '.') { ctx.fillStyle = palette[k]; ctx.fillRect(x * px, y * px, px, px); }
  }));
}
function drawIcon() {
  const ink = getComputedStyle(document.body).getPropertyValue('--text').trim();
  sprite('icDoc', ['..........','.kkkkkk...','.k....kk..','.k.....k..','.k.kkk.k..','.k.....k..','.k.kkk.k..','.k.....k..','.kkkkkkk..','..........'], { k: ink }, 6);
}
window.gsRedraw = drawIcon; drawIcon();

</script>
</body>
</html>
