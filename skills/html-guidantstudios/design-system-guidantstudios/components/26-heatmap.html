<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Streak heatmap - /design-system-guidantstudios components</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='8' fill='%231433d6'/%3E%3Cpath d='M17 11h6v6h-6zM23 11h6v6h-6zM29 11h6v6h-6zM35 11h6v6h-6zM41 11h6v6h-6zM11 17h6v6h-6zM11 23h6v6h-6zM11 29h6v6h-6zM29 29h6v6h-6zM35 29h6v6h-6zM41 29h6v6h-6zM47 29h6v6h-6zM11 35h6v6h-6zM47 35h6v6h-6zM11 41h6v6h-6zM47 41h6v6h-6zM17 47h6v6h-6zM23 47h6v6h-6zM29 47h6v6h-6zM35 47h6v6h-6zM41 47h6v6h-6z' fill='%23fff'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,400..800&family=JetBrains+Mono:wght@400;500;700&family=Doto:wght@700;900&display=swap" rel="stylesheet">
<style>
html { color-scheme: dark; }
html[data-theme="light"] { color-scheme: light; }
:root, html[data-theme="dark"] {
  --bg:#0b0b0f; --card:#0b0b0f; --text:#f2f3f5; --muted:#9a9ea8; --accent:#4466ff;
  --line:rgba(242,243,245,.22); --shadow:rgba(242,243,245,.35);
}
html[data-theme="light"] {
  --bg:#f6f6f3; --card:#ffffff; --text:#0b0b0f; --muted:#5d6069; --accent:#1433d6;
  --line:rgba(11,11,15,.18); --shadow:rgba(11,11,15,.9);
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
  background:var(--bg); color:var(--text);
  font-family:'Archivo',sans-serif; font-weight:400;
  transition:background .25s, color .25s;
  min-height:100vh; display:flex; align-items:center; justify-content:center;
  padding:72px 28px;
}
.doto { font-family:'Doto',sans-serif; font-weight:900; margin:0 .18em; }
.kicker {
  font-size:11px; font-weight:400; letter-spacing:6px; text-transform:uppercase;
  color:var(--muted);
}
.stage { width:100%; max-width:860px; }
#themeToggle {
  position:fixed; top:16px; right:16px; z-index:100;
  width:40px; height:40px; border:2px solid var(--text); background:var(--card);
  color:var(--text); border-radius:0; cursor:pointer; font-size:18px; line-height:1;
  font-family:'Archivo',sans-serif; box-shadow:3px 3px 0 var(--shadow);
}
#themeToggle:active { box-shadow:1px 1px 0 var(--shadow); transform:translate(2px,2px); }

.heat { border:2px solid var(--text); background:var(--card); box-shadow:6px 6px 0 var(--shadow); padding:24px 28px 20px; }
.heat-t { font-size:17px; font-weight:600; letter-spacing:-0.3px; margin:6px 0 18px; }
.heat-t b { color:var(--accent); font-weight:600; }
.heat-grid { display:grid; grid-template-rows:repeat(7,14px); grid-auto-flow:column; grid-auto-columns:14px; gap:4px; }
.heat-cell { width:10px; height:10px; margin:2px; background:var(--text); opacity:.07; }
.heat-cell[data-l="1"] { background:var(--accent); opacity:.3; }
.heat-cell[data-l="2"] { background:var(--accent); opacity:.6; }
.heat-cell[data-l="3"] { background:var(--accent); opacity:1; }
.heat-leg { display:flex; align-items:center; gap:6px; margin-top:14px; font-size:10.5px; letter-spacing:2px; text-transform:uppercase; color:var(--muted); }
.heat-leg i { width:10px; height:10px; background:var(--accent); }
</style>
</head>
<body>
<button id="themeToggle" aria-label="Toggle dark / light mode">◐</button>
<div class="stage">
<figure class="heat">
  <span class="kicker">Uploads · last 26 weeks</span>
  <div class="heat-t">The streak is the strategy - <b>0 missed weeks</b></div>
  <div class="heat-grid" id="heatGrid"></div>
  <div class="heat-leg">less <i style="opacity:.15"></i><i style="opacity:.3"></i><i style="opacity:.6"></i><i></i> more</div>
</figure>
</div>
<script>

(function () {
  const root = document.documentElement;
  const apply = t => {
    root.setAttribute('data-theme', t);
    root.style.colorScheme = t;
    if (window.gsRedraw) window.gsRedraw();
  };
  const forced = new URLSearchParams(location.search).get('theme');
  apply(forced || localStorage.getItem('gs-theme') || 'light');
  document.getElementById('themeToggle').addEventListener('click', () => {
    const next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    localStorage.setItem('gs-theme', next);
    apply(next);
  });
  window.addEventListener('message', e => {
    if (e.data && e.data.gsTheme) { localStorage.setItem('gs-theme', e.data.gsTheme); apply(e.data.gsTheme); }
  });
})();

function pn(x, y) { const v = Math.sin(x * 127.1 + y * 311.7) * 43758.5453; return v - Math.floor(v); }
const g = document.getElementById('heatGrid');
let html = '';
for (let w = 0; w < 26; w++) for (let d = 0; d < 7; d++) {
  const n = pn(w, d);
  const lvl = (d === 2) ? 3 : (n > .82 ? 2 : n > .55 ? 1 : 0);   // Tuesday upload never misses
  html += '<span class="heat-cell" data-l="' + lvl + '" title="wk ' + (w + 1) + '"></span>';
}
g.innerHTML = html;

</script>
</body>
</html>
