<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hero block - /design-system-guidantstudios components</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='8' fill='%231433d6'/%3E%3Cpath d='M17 11h6v6h-6zM23 11h6v6h-6zM29 11h6v6h-6zM35 11h6v6h-6zM41 11h6v6h-6zM11 17h6v6h-6zM11 23h6v6h-6zM11 29h6v6h-6zM29 29h6v6h-6zM35 29h6v6h-6zM41 29h6v6h-6zM47 29h6v6h-6zM11 35h6v6h-6zM47 35h6v6h-6zM11 41h6v6h-6zM47 41h6v6h-6zM17 47h6v6h-6zM23 47h6v6h-6zM29 47h6v6h-6zM35 47h6v6h-6zM41 47h6v6h-6z' fill='%23fff'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,400..800&family=JetBrains+Mono:wght@400;500;700&family=Doto:wght@700;900&display=swap" rel="stylesheet">
<style>
html { color-scheme: dark; }
html[data-theme="light"] { color-scheme: light; }
:root, html[data-theme="dark"] {
  --bg:#0b0b0f; --card:#0b0b0f; --text:#f2f3f5; --muted:#9a9ea8; --accent:#4466ff;
  --line:rgba(242,243,245,.22); --shadow:rgba(242,243,245,.35);
}
html[data-theme="light"] {
  --bg:#f6f6f3; --card:#ffffff; --text:#0b0b0f; --muted:#5d6069; --accent:#1433d6;
  --line:rgba(11,11,15,.18); --shadow:rgba(11,11,15,.9);
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
  background:var(--bg); color:var(--text);
  font-family:'Archivo',sans-serif; font-weight:400;
  transition:background .25s, color .25s;
  min-height:100vh; display:flex; align-items:center; justify-content:center;
  padding:72px 28px;
}
.doto { font-family:'Doto',sans-serif; font-weight:900; margin:0 .18em; }
.kicker {
  font-size:11px; font-weight:400; letter-spacing:6px; text-transform:uppercase;
  color:var(--muted);
}
.stage { width:100%; max-width:860px; }
#themeToggle {
  position:fixed; top:16px; right:16px; z-index:100;
  width:40px; height:40px; border:2px solid var(--text); background:var(--card);
  color:var(--text); border-radius:0; cursor:pointer; font-size:18px; line-height:1;
  font-family:'Archivo',sans-serif; box-shadow:3px 3px 0 var(--shadow);
}
#themeToggle:active { box-shadow:1px 1px 0 var(--shadow); transform:translate(2px,2px); }

.hero { display:grid; grid-template-columns:1.25fr .75fr; gap:44px; align-items:center; }
.hero-k { margin-bottom:22px; }
.hero-h { font-size:52px; font-weight:600; letter-spacing:-2px; line-height:1.06; margin-bottom:22px; }
.hero-h .doto { color:var(--accent); font-size:.92em; }
.hero-s { font-size:17px; color:var(--muted); line-height:1.6; max-width:44ch; margin-bottom:30px; }
.hero-cta {
  display:inline-block; font-weight:600; font-size:15px; color:#fff; background:var(--accent);
  border:2px solid var(--accent); padding:14px 28px; text-decoration:none;
  box-shadow:4px 4px 0 var(--shadow);
}
.hero-cta:active { transform:translate(2px,2px); box-shadow:1px 1px 0 var(--shadow); }
.hero-art { justify-self:center; }
@media (max-width:720px){ .hero{grid-template-columns:1fr;} .hero-art{display:none;} }

/* GS lock: button voice = Archivo Expanded 600, uppercase, .08em, radius 4px */
.hero-cta { font-family:'Archivo',sans-serif; font-stretch:125%; font-weight:600; text-transform:uppercase; letter-spacing:.08em; font-size:13px; border-radius:4px; }
</style>
</head>
<body>
<button id="themeToggle" aria-label="Toggle dark / light mode">◐</button>
<div class="stage">
<section class="hero">
  <div>
    <div class="kicker hero-k">the brand · Weekly build</div>
    <h1 class="hero-h">Agents that work while you<span class="doto">SLEEP</span></h1>
    <p class="hero-s">One sellable system a week. The prompt is free, the build is yours - learn to make both.</p>
    <a class="hero-cta" href="#">Get this week's build</a>
  </div>
  <canvas class="hero-art" id="heroDots"></canvas>
</section>
</div>
<script>

(function () {
  const root = document.documentElement;
  const apply = t => {
    root.setAttribute('data-theme', t);
    root.style.colorScheme = t;
    if (window.gsRedraw) window.gsRedraw();
  };
  const forced = new URLSearchParams(location.search).get('theme');
  apply(forced || localStorage.getItem('gs-theme') || 'light');
  document.getElementById('themeToggle').addEventListener('click', () => {
    const next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    localStorage.setItem('gs-theme', next);
    apply(next);
  });
  window.addEventListener('message', e => {
    if (e.data && e.data.gsTheme) { localStorage.setItem('gs-theme', e.data.gsTheme); apply(e.data.gsTheme); }
  });
})();

function halftone(id, w, h, step, maxR, color, fn, color2, fn2) {
  const c = document.getElementById(id); if (!c) return;
  const ctx = c.getContext('2d'); const dpr = window.devicePixelRatio || 1;
  c.width = w * dpr; c.height = h * dpr; c.style.width = w + 'px'; c.style.height = h + 'px'; ctx.scale(dpr, dpr);
  ctx.clearRect(0, 0, w, h);
  for (let y = step / 2; y < h; y += step) for (let x = step / 2; x < w; x += step) {
    const u = x / w, v = y / h;
    let b = fn(u, v), col = color;
    if (fn2) { const b2 = fn2(u, v); if (b2 > b) { b = b2; col = color2; } }
    if (b <= 0.02) continue;
    ctx.fillStyle = col; ctx.beginPath(); ctx.arc(x, y, Math.min(maxR, b * maxR), 0, Math.PI * 2); ctx.fill();
  }
}
function inkDot() {
  return document.documentElement.getAttribute('data-theme') === 'light'
    ? 'rgba(11,11,15,0.88)' : 'rgba(242,243,245,0.85)';
}

function drawHero() {
  const acc = '#1433d6';
  // shaded sphere, lambert light from top-left, cobalt crescent feature
  halftone('heroDots', 300, 300, 6, 1.9, inkDot(), (u, v) => {
    const dx = u - .5, dy = v - .5, d = Math.sqrt(dx*dx + dy*dy);
    if (d > .42) return 0;
    const z = Math.sqrt(Math.max(0, .42*.42 - d*d)) / .42;
    const nx = dx/.42, ny = dy/.42;
    return Math.max(0, (-nx*.55 - ny*.55 + z*.62)) + .08;
  }, acc, (u, v) => {
    const dx = u - .62, dy = v - .36, d = Math.sqrt(dx*dx + dy*dy);
    return (d > .07 && d < .13) ? .95 : 0;
  });
}
window.gsRedraw = drawHero; drawHero();

</script>
</body>
</html>
