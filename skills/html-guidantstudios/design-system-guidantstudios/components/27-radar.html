<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Radar chart - /design-system-guidantstudios components</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='8' fill='%231433d6'/%3E%3Cpath d='M17 11h6v6h-6zM23 11h6v6h-6zM29 11h6v6h-6zM35 11h6v6h-6zM41 11h6v6h-6zM11 17h6v6h-6zM11 23h6v6h-6zM11 29h6v6h-6zM29 29h6v6h-6zM35 29h6v6h-6zM41 29h6v6h-6zM47 29h6v6h-6zM11 35h6v6h-6zM47 35h6v6h-6zM11 41h6v6h-6zM47 41h6v6h-6zM17 47h6v6h-6zM23 47h6v6h-6zM29 47h6v6h-6zM35 47h6v6h-6zM41 47h6v6h-6z' fill='%23fff'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,400..800&family=JetBrains+Mono:wght@400;500;700&family=Doto:wght@700;900&display=swap" rel="stylesheet">
<style>
html { color-scheme: dark; }
html[data-theme="light"] { color-scheme: light; }
:root, html[data-theme="dark"] {
  --bg:#0b0b0f; --card:#0b0b0f; --text:#f2f3f5; --muted:#9a9ea8; --accent:#4466ff;
  --line:rgba(242,243,245,.22); --shadow:rgba(242,243,245,.35);
}
html[data-theme="light"] {
  --bg:#f6f6f3; --card:#ffffff; --text:#0b0b0f; --muted:#5d6069; --accent:#1433d6;
  --line:rgba(11,11,15,.18); --shadow:rgba(11,11,15,.9);
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
  background:var(--bg); color:var(--text);
  font-family:'Archivo',sans-serif; font-weight:400;
  transition:background .25s, color .25s;
  min-height:100vh; display:flex; align-items:center; justify-content:center;
  padding:72px 28px;
}
.doto { font-family:'Doto',sans-serif; font-weight:900; margin:0 .18em; }
.kicker {
  font-size:11px; font-weight:400; letter-spacing:6px; text-transform:uppercase;
  color:var(--muted);
}
.stage { width:100%; max-width:860px; }
#themeToggle {
  position:fixed; top:16px; right:16px; z-index:100;
  width:40px; height:40px; border:2px solid var(--text); background:var(--card);
  color:var(--text); border-radius:0; cursor:pointer; font-size:18px; line-height:1;
  font-family:'Archivo',sans-serif; box-shadow:3px 3px 0 var(--shadow);
}
#themeToggle:active { box-shadow:1px 1px 0 var(--shadow); transform:translate(2px,2px); }

.radar { border:2px solid var(--text); background:var(--card); box-shadow:6px 6px 0 var(--shadow); padding:26px 30px 22px; display:grid; grid-template-columns:auto auto; gap:26px; align-items:center; }
.radar svg { display:block; }
.radar .web { stroke:var(--line); fill:none; stroke-width:1; }
.radar .axis { stroke:var(--line); stroke-width:1; }
.radar .shape { fill:url(#rdots); stroke:var(--accent); stroke-width:2.5; stroke-linejoin:round; }
.radar .lbl { font:400 9.5px 'Archivo',sans-serif; letter-spacing:2px; fill:var(--muted); text-transform:uppercase; }
.radar-side { display:grid; gap:8px; }
.radar-t { font-size:17px; font-weight:600; letter-spacing:-0.3px; max-width:16ch; }
.radar-s { font-size:12.5px; color:var(--muted); line-height:1.55; max-width:22ch; }
</style>
</head>
<body>
<button id="themeToggle" aria-label="Toggle dark / light mode">◐</button>
<div class="stage">
<figure class="radar">
  <svg viewBox="0 0 260 240" width="260" height="240">
    <defs><pattern id="rdots" width="7" height="7" patternUnits="userSpaceOnUse"><circle cx="3.5" cy="3.5" r="1.6" fill="#1433d6" opacity=".55"/></pattern></defs>
    <g id="radarWeb"></g>
    <polygon class="shape" id="radarShape"/>
    <g id="radarLbls"></g>
  </svg>
  <div class="radar-side">
    <span class="kicker">Channel health</span>
    <div class="radar-t">Strong hooks, retention next</div>
    <div class="radar-s">Scored monthly against the 16-step content process.</div>
  </div>
</figure>
</div>
<script>

(function () {
  const root = document.documentElement;
  const apply = t => {
    root.setAttribute('data-theme', t);
    root.style.colorScheme = t;
    if (window.gsRedraw) window.gsRedraw();
  };
  const forced = new URLSearchParams(location.search).get('theme');
  apply(forced || localStorage.getItem('gs-theme') || 'light');
  document.getElementById('themeToggle').addEventListener('click', () => {
    const next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    localStorage.setItem('gs-theme', next);
    apply(next);
  });
  window.addEventListener('message', e => {
    if (e.data && e.data.gsTheme) { localStorage.setItem('gs-theme', e.data.gsTheme); apply(e.data.gsTheme); }
  });
})();

const AXES = ['Hooks', 'Retention', 'Packaging', 'Cadence', 'Community'];
const VALS = [.92, .64, .8, .98, .74];
const CX2 = 130, CY2 = 122, RD = 88;
const pt = (i, r) => { const a = -Math.PI/2 + i * 2 * Math.PI / AXES.length; return [CX2 + Math.cos(a) * r, CY2 + Math.sin(a) * r]; };
let web = '';
for (const f of [.33, .66, 1]) web += '<polygon class="web" points="' + AXES.map((_, i) => pt(i, RD * f).join(',')).join(' ') + '"/>';
web += AXES.map((_, i) => { const [x, y] = pt(i, RD); return '<line class="axis" x1="' + CX2 + '" y1="' + CY2 + '" x2="' + x + '" y2="' + y + '"/>'; }).join('');
document.getElementById('radarWeb').innerHTML = web;
document.getElementById('radarShape').setAttribute('points', AXES.map((_, i) => pt(i, RD * VALS[i]).join(',')).join(' '));
document.getElementById('radarLbls').innerHTML = AXES.map((a, i) => {
  const [x, y] = pt(i, RD + 16);
  return '<text class="lbl" x="' + x + '" y="' + (y + 3) + '" text-anchor="middle">' + a + '</text>';
}).join('');

</script>
</body>
</html>
